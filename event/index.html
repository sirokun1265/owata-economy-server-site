<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <title>OWATA夏祭り 大会速報</title>
  <meta name="description" content="OWATA夏祭り PVPトーナメント・氷ボート大会の参加者、組み合わせ、結果をリアルタイム表示します。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">OWATA SUMMER FESTIVAL</p>
      <h1>大会速報</h1>
      <p class="lead">PVPトーナメントと氷ボート大会の参加者・組み合わせ・結果をリアルタイムで確認できます。</p>
    </div>
    <div id="connectionBadge" class="status-badge waiting">接続確認中</div>
  </header>

  <nav class="tabs" aria-label="表示切替">
    <button class="tab active" data-tab="pvp">PVPトーナメント</button>
    <button class="tab" data-tab="boat">氷ボート</button>
  </nav>

  <main>
    <aside id="offlineNotice" class="notice error hidden" role="status">
      大会データに接続できません。前回取得した内容を表示しています。
    </aside>

    <section id="pvpPanel" class="panel active" aria-labelledby="pvpTitle">
      <div class="section-heading">
        <div><p class="section-number">01</p><h2 id="pvpTitle">PVPトーナメント</h2></div>
        <div id="pvpStatus" class="pill">受付状況を確認中</div>
      </div>
      <div class="summary-grid">
        <article><span>参加者</span><strong id="pvpCount">0</strong></article>
        <article><span>赤チーム</span><strong id="redCount">0</strong></article>
        <article><span>白チーム</span><strong id="whiteCount">0</strong></article>
        <article><span>優勝</span><strong id="pvpChampion">未決定</strong></article>
      </div>
      <div class="content-grid">
        <section class="card"><h3>参加者</h3><div id="pvpParticipants" class="participant-list empty">まだ参加者はいません</div></section>
        <section class="card bracket-card"><h3>対戦表</h3><div id="pvpBracket" class="bracket empty">組み合わせ作成前です</div></section>
      </div>
    </section>

    <section id="boatPanel" class="panel" aria-labelledby="boatTitle">
      <div class="section-heading">
        <div><p class="section-number">02</p><h2 id="boatTitle">氷ボート大会</h2></div>
        <div id="boatStatus" class="pill">受付状況を確認中</div>
      </div>
      <div class="summary-grid two">
        <article><span>参加者</span><strong id="boatCount">0</strong></article>
        <article><span>優勝</span><strong id="boatChampion">未決定</strong></article>
      </div>
      <div class="content-grid">
        <section class="card"><h3>参加者</h3><div id="boatParticipants" class="participant-list empty">まだ参加者はいません</div></section>
        <section class="card bracket-card"><h3>トーナメント表</h3><div id="boatHeats" class="heat-list empty">組み合わせ作成前です</div></section>
      </div>
    </section>

  </main>

  <footer><span>OWATA経済サーバー 夏祭り</span><span id="lastUpdated">最終更新: --</span></footer>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
