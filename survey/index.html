<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="referrer" content="no-referrer">

  <meta property="og:type" content="website">
  <meta property="og:title" content="匿名アドオンアンケート｜OWATA経済サーバー">
  <meta property="og:description" content="名前・メール不要。サーバーへの意見や欲しい機能を匿名で送れます。">
  <meta property="og:url" content="https://sirokun1265.github.io/owata-economy-server-site/survey/">
  <meta property="og:image" content="https://sirokun1265.github.io/owata-economy-server-site/public/media/summer-festival.png">

  <link rel="icon" href="../public/media/owata-logo.png">
  <link rel="stylesheet" href="../analytics.css">
  <script src="../analytics.js" data-privacy-url="../privacy.html" defer></script>
  <style>
    :root { color-scheme: light; font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f4f7f5; }
    body { display: grid; grid-template-rows: 58px minmax(0, 1fr); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 8px clamp(12px, 3vw, 34px); border-bottom: 1px solid rgba(255,255,255,.13); background: #07130f; color: #fff; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
    .brand img { width: 40px; height: 40px; border: 2px solid #fff; border-radius: 50%; object-fit: cover; }
    .brand span { display: grid; line-height: 1; }
    .brand b { font-size: 15px; letter-spacing: .08em; }
    .brand small { margin-top: 5px; color: #1be54a; font: 700 8px/1 Consolas, monospace; letter-spacing: .14em; }
    .survey-meta { display: flex; align-items: center; gap: 14px; }
    .privacy { color: #b7c7bd; font-size: 11px; font-weight: 700; }
    .privacy::before { color: #1be54a; content: "●"; margin-right: 7px; }
    .privacy-link { color: #fff; font-size: 11px; font-weight: 700; text-underline-offset: 3px; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #f4f7f5; }
    .fallback { display: none; }
    @media (max-width: 560px) { body { grid-template-rows: 52px minmax(0, 1fr); } .brand img { width: 34px; height: 34px; } .brand b { font-size: 13px; } .privacy { display: none; } .privacy-link { font-size: 10px; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="../" aria-label="OWATA経済サーバー公式サイトへ戻る">
      <img src="../public/media/owata-logo.png" alt="">
      <span><b>OWATA 経済サーバー</b><small>ANONYMOUS SURVEY</small></span>
    </a>
    <div class="survey-meta"><span class="privacy">名前・メール不要</span><a class="privacy-link" href="../privacy.html">アクセス解析設定</a></div>
  </header>
  <iframe
    src="https://owata-addon-survey.itoutubasa1265.chatgpt.site/"
    title="OWATA経済サーバー 匿名アドオンアンケート"
    referrerpolicy="no-referrer"
    allow="clipboard-write"
  ></iframe>
  <noscript class="fallback">このアンケートにはJavaScriptが必要です。</noscript>
</body>
</html>
